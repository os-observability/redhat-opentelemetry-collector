$schema: https://json-schema.org/draft/2020-12/schema
title: prometheusremotewrite exporter configuration
type: object
properties:
    add_metric_suffixes:
        description: |-
            AddMetricSuffixes controls whether unit and type suffixes are added to metrics on export

            Deprecated: Use TranslationStrategy instead. It will be removed in v0.153.0.
        type: boolean
    auth:
        description: Auth configuration for outgoing HTTP calls.
        type: object
        properties:
            authenticator:
                description: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                type: string
        additionalProperties: false
    compression:
        description: The compression key for supported compression types within collector.
        type: string
    compression_params:
        description: Advanced configuration options for the Compression
        type: object
        properties:
            level:
                type: integer
        additionalProperties: false
    convert_explicit_histograms_to_nhcb:
        description: ConvertExplicitHistogramsToNHCB converts explicit-bucket histograms to NHCB (schema -53) instead of classic series.
        type: boolean
    cookies:
        description: Cookies configures the cookie management of the HTTP client.
        type: object
    disable_keep_alives:
        description: 'Deprecated: [v0.160.0] set ''keepalive::enabled'' to false to disable keep-alives.'
        type: boolean
    disable_scope_info:
        description: DisableScopeInfo allows disabling the export of the scope info labels
        type: boolean
    endpoint:
        description: 'The target URL to send data to (e.g.: http://some.url:9411/v1/traces).'
        type: string
    external_labels:
        description: ExternalLabels defines a map of label keys and values that are allowed to start with reserved prefix "__"
        type: object
        additionalProperties:
            type: string
    force_attempt_http2:
        description: |-
            Enabling ForceAttemptHTTP2 forces the HTTP transport to use the HTTP/2 protocol.
            By default, this is set to true.
            NOTE: HTTP/2 does not support settings such as MaxConnsPerHost, MaxIdleConnsPerHost and MaxIdleConns.
        type: boolean
    headers:
        description: |-
            Additional headers attached to each HTTP request sent by the client.
            Existing header values are overwritten if collision happens.
            Header values are opaque since they may be sensitive.
        type: object
    http:
        description: |-
            HTTP defines the HTTP client configuration in a nested block.
            This field takes precedence over the squashed ClientConfig when set.
        type: object
        properties:
            auth:
                description: Auth configuration for outgoing HTTP calls.
                type: object
                properties:
                    authenticator:
                        description: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                        type: string
                additionalProperties: false
            compression:
                description: The compression key for supported compression types within collector.
                type: string
            compression_params:
                description: Advanced configuration options for the Compression
                type: object
                properties:
                    level:
                        type: integer
                additionalProperties: false
            cookies:
                description: Cookies configures the cookie management of the HTTP client.
                type: object
            disable_keep_alives:
                description: 'Deprecated: [v0.160.0] set ''keepalive::enabled'' to false to disable keep-alives.'
                type: boolean
            endpoint:
                description: 'The target URL to send data to (e.g.: http://some.url:9411/v1/traces).'
                type: string
            force_attempt_http2:
                description: |-
                    Enabling ForceAttemptHTTP2 forces the HTTP transport to use the HTTP/2 protocol.
                    By default, this is set to true.
                    NOTE: HTTP/2 does not support settings such as MaxConnsPerHost, MaxIdleConnsPerHost and MaxIdleConns.
                type: boolean
            headers:
                description: |-
                    Additional headers attached to each HTTP request sent by the client.
                    Existing header values are overwritten if collision happens.
                    Header values are opaque since they may be sensitive.
                type: object
            http2_ping_timeout:
                description: |-
                    HTTP2PingTimeout if there's no response to the ping within the configured value, the connection will be closed.
                    If not set or set to 0, it defaults to 15s.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            http2_read_idle_timeout:
                description: |-
                    This is needed in case you run into
                    https://github.com/golang/go/issues/59690
                    https://github.com/golang/go/issues/36026
                    HTTP2ReadIdleTimeout if the connection has been idle for the configured value send a ping frame for health check
                    0s means no health check will be performed.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            idle_conn_timeout:
                description: 'Deprecated: [v0.160.0] use Keepalive.IdleConnTimeout instead.'
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            keepalive:
                description: |-
                    Keepalive configuration. Unmarshal folds this section into the deprecated
                    fields below, which remain the source of truth during their deprecation
                    window, and always resets it to None. A value visible to ToClient was
                    therefore set programmatically after unmarshaling (or the config was
                    never unmarshaled) and takes precedence over the deprecated fields.
                type: object
                properties:
                    idle_conn_timeout:
                        description: |-
                            IdleConnTimeout is the maximum amount of time an idle (keep-alive) connection will remain open before closing itself.
                            By default, it is set to 90 seconds.
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    max_idle_conns:
                        description: |-
                            MaxIdleConns is used to set a limit to the maximum idle HTTP connections the client can keep open.
                            By default, it is set to 100. Zero means no limit.
                        type: integer
                    max_idle_conns_per_host:
                        description: |-
                            MaxIdleConnsPerHost is used to set a limit to the maximum idle HTTP connections the host can keep open.
                            If zero, [net/http.DefaultMaxIdleConnsPerHost] is used.
                        type: integer
                additionalProperties: false
            max_conns_per_host:
                description: |-
                    MaxConnsPerHost limits the total number of connections per host, including connections in the dialing,
                    active, and idle states. Default is 0 (unlimited).
                type: integer
            max_idle_conns:
                description: 'Deprecated: [v0.160.0] use Keepalive.MaxIdleConns instead.'
                type: integer
            max_idle_conns_per_host:
                description: 'Deprecated: [v0.160.0] use Keepalive.MaxIdleConnsPerHost instead.'
                type: integer
            middlewares:
                description: |-
                    Middlewares are used to add custom functionality to the HTTP client.
                    Middleware handlers are called in the order they appear in this list,
                    with the first middleware becoming the outermost handler.
                type: array
                items:
                    type: object
                    properties:
                        id:
                            description: Specifies the name of the extension to use.
                            type: string
                    additionalProperties: false
            proxy_url:
                description: ProxyURL setting for the collector
                type: string
            read_buffer_size:
                description: |-
                    ReadBufferSize for HTTP client. See http.Transport.ReadBufferSize.
                    Default is 0.
                type: integer
            timeout:
                description: |-
                    Timeout parameter configures `http.Client.Timeout`.
                    Default is 0 (unlimited).
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            tls:
                description: TLS struct exposes TLS client configuration.
                type: object
                properties:
                    ca_file:
                        description: |-
                            CAFile path to the CA cert. For a client this verifies the server certificate.
                            For a server this verifies client certificates. If empty uses system root CA. (optional)
                        type: string
                    ca_pem:
                        description: CAPem in memory PEM encoded cert. (optional)
                        type: string
                    cert_file:
                        description: CertFile path to the TLS cert to use for TLS required connections. (optional)
                        type: string
                    cert_pem:
                        description: CertPem in memory PEM encoded TLS cert to use for TLS required connections. (optional)
                        type: string
                    cipher_suites:
                        description: |-
                            CipherSuites a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used.
                            See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                        type: array
                        items:
                            type: string
                    curve_preferences:
                        description: |-
                            CurvePreferences contains the elliptic curves that will be used in an ECDHE handshake,
                            in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                        type: array
                        items:
                            type: string
                    include_insecure_cipher_suites:
                        description: |-
                            IncludeInsecureCipherSuites enables support for insecure cipher suites. When set to true, cipher suites returned by
                            tls.InsecureCipherSuites() will be available for selection in addition to the secure ones.
                            This should only be used when working with legacy systems that require insecure cipher suites.
                            (optional, default false)
                        type: boolean
                    include_system_ca_certs_pool:
                        description: IncludeSystemCACertsPool if true, load system CA certificates pool in addition to the certificates configured in this struct.
                        type: boolean
                    insecure:
                        description: |-
                            Insecure in gRPC and HTTP when set to true, this is used to disable the client transport security.
                            See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC.
                            Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
                        type: boolean
                    insecure_skip_verify:
                        description: InsecureSkipVerify enables TLS but not verify the certificate.
                        type: boolean
                    key_file:
                        description: KeyFile path to the TLS key to use for TLS required connections. (optional)
                        type: string
                    key_pem:
                        description: KeyPem in memory PEM encoded TLS key to use for TLS required connections. (optional)
                        type: string
                    max_version:
                        description: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                        type: string
                    min_version:
                        description: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                        type: string
                    reload_interval:
                        description: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    server_name_override:
                        description: |-
                            ServerName server name requested by client for virtual hosting. This sets the ServerName in the TLSConfig.
                            Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                        type: string
                    tpm:
                        description: TPMConfig trusted platform module configuration
                        type: object
                        properties:
                            auth:
                                type: string
                            enabled:
                                type: boolean
                            owner_auth:
                                type: string
                            path:
                                description: Path the path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                                type: string
                        additionalProperties: false
                additionalProperties: false
            write_buffer_size:
                description: |-
                    WriteBufferSize for HTTP client. See http.Transport.WriteBufferSize.
                    Default is 0.
                type: integer
        additionalProperties: false
    http2_ping_timeout:
        description: |-
            HTTP2PingTimeout if there's no response to the ping within the configured value, the connection will be closed.
            If not set or set to 0, it defaults to 15s.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    http2_read_idle_timeout:
        description: |-
            This is needed in case you run into
            https://github.com/golang/go/issues/59690
            https://github.com/golang/go/issues/36026
            HTTP2ReadIdleTimeout if the connection has been idle for the configured value send a ping frame for health check
            0s means no health check will be performed.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    idle_conn_timeout:
        description: 'Deprecated: [v0.160.0] use Keepalive.IdleConnTimeout instead.'
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    include_metadata_keys:
        description: |-
            IncludeMetadataKeys is a list of client metadata keys whose values are
            forwarded as HTTP request headers on every remote write call.
        type: array
        items:
            type: string
    keep_classic_histograms:
        description: KeepClassicHistograms also emits the classic series alongside NHCB; no effect unless convert_explicit_histograms_to_nhcb is set.
        type: boolean
    keepalive:
        description: |-
            Keepalive configuration. Unmarshal folds this section into the deprecated
            fields below, which remain the source of truth during their deprecation
            window, and always resets it to None. A value visible to ToClient was
            therefore set programmatically after unmarshaling (or the config was
            never unmarshaled) and takes precedence over the deprecated fields.
        type: object
        properties:
            idle_conn_timeout:
                description: |-
                    IdleConnTimeout is the maximum amount of time an idle (keep-alive) connection will remain open before closing itself.
                    By default, it is set to 90 seconds.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_idle_conns:
                description: |-
                    MaxIdleConns is used to set a limit to the maximum idle HTTP connections the client can keep open.
                    By default, it is set to 100. Zero means no limit.
                type: integer
            max_idle_conns_per_host:
                description: |-
                    MaxIdleConnsPerHost is used to set a limit to the maximum idle HTTP connections the host can keep open.
                    If zero, [net/http.DefaultMaxIdleConnsPerHost] is used.
                type: integer
        additionalProperties: false
    max_batch_request_parallelism:
        description: maximum amount of parallel requests to do when handling large batch request
        type: integer
    max_batch_size_bytes:
        description: maximum size in bytes of time series batch sent to remote storage
        type: integer
    max_conns_per_host:
        description: |-
            MaxConnsPerHost limits the total number of connections per host, including connections in the dialing,
            active, and idle states. Default is 0 (unlimited).
        type: integer
    max_idle_conns:
        description: 'Deprecated: [v0.160.0] use Keepalive.MaxIdleConns instead.'
        type: integer
    max_idle_conns_per_host:
        description: 'Deprecated: [v0.160.0] use Keepalive.MaxIdleConnsPerHost instead.'
        type: integer
    middlewares:
        description: |-
            Middlewares are used to add custom functionality to the HTTP client.
            Middleware handlers are called in the order they appear in this list,
            with the first middleware becoming the outermost handler.
        type: array
        items:
            type: object
            properties:
                id:
                    description: Specifies the name of the extension to use.
                    type: string
            additionalProperties: false
    namespace:
        description: |-
            prefix attached to each exported metric name
            See: https://prometheus.io/docs/practices/naming/#metric-names
        type: string
    protobuf_message:
        description: RemoteWriteProtoMsg controls whether prometheus remote write v1 or v2 is sent.
        type: string
    proxy_url:
        description: ProxyURL setting for the collector
        type: string
    read_buffer_size:
        description: |-
            ReadBufferSize for HTTP client. See http.Transport.ReadBufferSize.
            Default is 0.
        type: integer
    remote_write_queue:
        description: |-
            QueueConfig allows users to fine tune the queues
            that handle outgoing requests.
        type: object
        properties:
            enabled:
                description: |-
                    Enabled if false the queue is not enabled, the export requests
                    are executed synchronously.
                type: boolean
            num_consumers:
                description: |-
                    NumWorkers configures the number of workers used by
                    the collector to fan out remote write requests.
                type: integer
            queue_size:
                description: |-
                    QueueSize is the maximum number of OTLP metric batches allowed
                    in the queue at a given time. Ignored if Enabled is false.
                type: integer
        additionalProperties: false
    resource_constant_labels:
        description: ResourceConstantLabels controls which resource attributes are added as constant labels on Prometheus metrics.
        type: object
        properties:
            enabled:
                description: |-
                    Enabled indicates whether to convert resource attributes to telemetry attributes. Default is `false`.

                    Deprecated: Use Included and Excluded instead. To convert all resource attributes, set Included to ["*"].
                type: boolean
            exclude_service_attributes:
                description: |-
                    ExcludeServiceAttributes indicates whether to exclude `service.name`, `service.instance.id` and `service.namespace`
                    resource attributes from being converted to metric attributes. Default is `false`.
                    When set to `true`, these attributes will not be added to metric labels since they are
                    already mapped to Prometheus `job` and `instance` labels respectively.

                    Deprecated: Use Excluded instead. To exclude service attributes, add "service.name", "service.instance.id", and "service.namespace" to Excluded.
                type: boolean
            excluded:
                description: |-
                    Excluded represents a list of patterns (supporting wildcards '*' and '?') of resource attribute keys to exclude,
                    overriding anything that matched Included. If Included is empty, setting Excluded implies including all non-excluded attributes.
                type: array
                items:
                    type: string
            included:
                description: |-
                    Included represents a list of patterns (supporting wildcards '*' and '?') of resource attribute keys to include.
                    Wildcards '*' and '?' match any sequence of characters and any single character respectively (and cannot be escaped).
                    Note: if Included is empty and Excluded is non-empty, all resource attributes except those matched by Excluded will be included.
                type: array
                items:
                    type: string
        additionalProperties: false
    resource_to_telemetry_conversion:
        description: |-
            ResourceToTelemetrySettings is the option for converting resource attributes to telemetry attributes.
            "Enabled" - A boolean field to enable/disable this option. Default is `false`.
            If enabled, all the resource attributes will be converted to metric labels by default.
            "ExcludeServiceAttributes" - If set to `true`, the `service.name`, `service.instance.id` and `service.namespace` resource attributes,
            which are already converted to `job` and `instance` labels respectively, will be excluded from the final metrics.

            Deprecated: Use ResourceConstantLabels instead.
        type: object
        properties:
            enabled:
                description: |-
                    Enabled indicates whether to convert resource attributes to telemetry attributes. Default is `false`.

                    Deprecated: Use Included and Excluded instead. To convert all resource attributes, set Included to ["*"].
                type: boolean
            exclude_service_attributes:
                description: |-
                    ExcludeServiceAttributes indicates whether to exclude `service.name`, `service.instance.id` and `service.namespace`
                    resource attributes from being converted to metric attributes. Default is `false`.
                    When set to `true`, these attributes will not be added to metric labels since they are
                    already mapped to Prometheus `job` and `instance` labels respectively.

                    Deprecated: Use Excluded instead. To exclude service attributes, add "service.name", "service.instance.id", and "service.namespace" to Excluded.
                type: boolean
            excluded:
                description: |-
                    Excluded represents a list of patterns (supporting wildcards '*' and '?') of resource attribute keys to exclude,
                    overriding anything that matched Included. If Included is empty, setting Excluded implies including all non-excluded attributes.
                type: array
                items:
                    type: string
            included:
                description: |-
                    Included represents a list of patterns (supporting wildcards '*' and '?') of resource attribute keys to include.
                    Wildcards '*' and '?' match any sequence of characters and any single character respectively (and cannot be escaped).
                    Note: if Included is empty and Excluded is non-empty, all resource attributes except those matched by Excluded will be included.
                type: array
                items:
                    type: string
        additionalProperties: false
    retry_on_failure:
        type: object
        properties:
            enabled:
                description: Enabled indicates whether to not retry sending batches in case of export failure.
                type: boolean
            initial_interval:
                description: InitialInterval the time to wait after the first failure before retrying.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_elapsed_time:
                description: |-
                    MaxElapsedTime the maximum amount of time (including retries) spent trying to send a request/batch.
                    Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_interval:
                description: |-
                    MaxInterval the upper bound on backoff interval. Once this value is reached the delay
                    between consecutive retries will always be `MaxInterval`.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            multiplier:
                description: Multiplier the value multiplied by the backoff interval bounds
                type: number
            randomization_factor:
                description: |-
                    RandomizationFactor a random factor used to calculate next backoffs
                    Randomized interval = RetryInterval * (1 ± RandomizationFactor)
                type: number
        additionalProperties: false
    send_metadata:
        description: SendMetadata controls whether prometheus metadata will be generated and sent, this option is ignored when using PRW 2.0, which always includes metadata.
        type: boolean
    target_info:
        description: TargetInfo allows customizing the target_info metric
        type: object
        properties:
            enabled:
                description: Enabled if false the target_info metric is not generated by the exporter
                type: boolean
        additionalProperties: false
    timeout:
        description: |-
            Timeout parameter configures `http.Client.Timeout`.
            Default is 0 (unlimited).
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    tls:
        description: TLS struct exposes TLS client configuration.
        type: object
        properties:
            ca_file:
                description: |-
                    CAFile path to the CA cert. For a client this verifies the server certificate.
                    For a server this verifies client certificates. If empty uses system root CA. (optional)
                type: string
            ca_pem:
                description: CAPem in memory PEM encoded cert. (optional)
                type: string
            cert_file:
                description: CertFile path to the TLS cert to use for TLS required connections. (optional)
                type: string
            cert_pem:
                description: CertPem in memory PEM encoded TLS cert to use for TLS required connections. (optional)
                type: string
            cipher_suites:
                description: |-
                    CipherSuites a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used.
                    See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                type: array
                items:
                    type: string
            curve_preferences:
                description: |-
                    CurvePreferences contains the elliptic curves that will be used in an ECDHE handshake,
                    in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                type: array
                items:
                    type: string
            include_insecure_cipher_suites:
                description: |-
                    IncludeInsecureCipherSuites enables support for insecure cipher suites. When set to true, cipher suites returned by
                    tls.InsecureCipherSuites() will be available for selection in addition to the secure ones.
                    This should only be used when working with legacy systems that require insecure cipher suites.
                    (optional, default false)
                type: boolean
            include_system_ca_certs_pool:
                description: IncludeSystemCACertsPool if true, load system CA certificates pool in addition to the certificates configured in this struct.
                type: boolean
            insecure:
                description: |-
                    Insecure in gRPC and HTTP when set to true, this is used to disable the client transport security.
                    See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC.
                    Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
                type: boolean
            insecure_skip_verify:
                description: InsecureSkipVerify enables TLS but not verify the certificate.
                type: boolean
            key_file:
                description: KeyFile path to the TLS key to use for TLS required connections. (optional)
                type: string
            key_pem:
                description: KeyPem in memory PEM encoded TLS key to use for TLS required connections. (optional)
                type: string
            max_version:
                description: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                type: string
            min_version:
                description: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                type: string
            reload_interval:
                description: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            server_name_override:
                description: |-
                    ServerName server name requested by client for virtual hosting. This sets the ServerName in the TLSConfig.
                    Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                type: string
            tpm:
                description: TPMConfig trusted platform module configuration
                type: object
                properties:
                    auth:
                        type: string
                    enabled:
                        type: boolean
                    owner_auth:
                        type: string
                    path:
                        description: Path the path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                        type: string
                additionalProperties: false
        additionalProperties: false
    translation_strategy:
        description: |-
            TranslationStrategy controls how OTLP metric and attribute names are translated into Prometheus metric and label names.
            When set, this takes precedence over AddMetricSuffixes.
        type: string
    wal:
        description: WAL enables persisting metrics to a write-ahead-log before sending to the remote storage.
        type: object
        properties:
            buffer_size:
                type: integer
            directory:
                type: string
            lag_record_frequency:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            truncate_frequency:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
        additionalProperties: false
    write_buffer_size:
        description: |-
            WriteBufferSize for HTTP client. See http.Transport.WriteBufferSize.
            Default is 0.
        type: integer
additionalProperties: false
