                    a boolean indicating if the endpoint is common for both traces and metrics
                type: object
            protocol:
                type: string
            queuesize:
                description: |-
                    QueueSize is the maximum number of spans that the sending queue will hold
                    before applying back-pressure. It must be >= `2 * BatchMaxSize`, otherwise the
                    memory queue rejects every batch with "element size too large" and drops
                    spans permanently. If left at 0 it defaults to `4 * BatchMaxSize`.
                type: integer
            reporterscachelen:
                type: integer
            samplerconfig:
                type: object
                properties:
                    arg:
                        type: string
                    name:
                        type: string
                additionalProperties: false
            sdkloglevel:
                description: |-
                    SDKLogLevel works independently from the global LogLevel because it prints GBs of logs in Debug mode
                    and the Info messages leak internal details that are not usually valuable for the final user.
                    Accepted values: debug, info, warn, error (case-insensitive). dpanic/panic/fatal are mapped to error.
                type: string
            tracesconsumer:
                type: object
            tracesendpoint:
                type: string
            tracesprotocol:
                type: string
        additionalProperties: false
additionalProperties: false
