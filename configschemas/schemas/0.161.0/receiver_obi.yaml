        properties:
            agentip:
                description: AgentIP allows overriding the reported Agent IP address on each stat.
                type: string
            agentipiface:
                description: |-
                    AgentIPIface specifies which interface should the agent pick the IP address from in order to
                    report it in the AgentIP field on each stat. Accepted values are: external (default), local,
                    or name:<interface name> (e.g. name:eth0).
                    If the AgentIP configuration property is set, this property has no effect.
                type: string
            agentiptype:
                description: |-
                    AgentIPType specifies which type of IP address (IPv4 or IPv6 or any) should the agent report
                    in the AgentID field of each stat. Accepted values are: any (default), ipv4, ipv6.
                    If the AgentIP configuration property is set, this property has no effect.
                type: string
            cidrs:
                description: |-
                    CIDRs list, to be set as the "src.cidr" and "dst.cidr"
                    attribute as a function of the source and destination IP addresses.
                    If an IP does not match any address here, the attributes won't be set.
                    If an IP matches multiple CIDR definitions, the stat will be decorated with the
                    narrowest CIDR. By this reason, you can safely add a 0.0.0.0/0 entry to group there
                    all the traffic that does not match any of the other CIDRs.
                type: object
            geoip:
                type: object
                properties:
                    cachelen:
                        description: It also accepts OTEL_EBPF_NETWORK_GEOIP_CACHE_LEN for backwards-compatibility
                        type: integer
                    cachettl:
                        description: It also accepts OTEL_EBPF_NETWORK_GEOIP_CACHE_TTL for backwards-compatibility
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    ipinfo:
                        type: object
                        properties:
                            path:
                                description: It also accepts OTEL_EBPF_NETWORK_GEOIP_IPINFO_PATH for backwards-compatibility
                                type: string
                        additionalProperties: false
                    maxmindinfo:
                        type: object
                        properties:
                            asnpath:
                                description: It also accepts OTEL_EBPF_NETWORK_GEOIP_MAXMIND_ASN_PATH for backwards-compatibility
                                type: string
                            countrypath:
                                description: It also accepts OTEL_EBPF_NETWORK_GEOIP_MAXMIND_COUNTRY_PATH for backwards-compatibility
                                type: string
                        additionalProperties: false
                additionalProperties: false
            print:
                description: Print enables printing the stats to the Standard Output
                type: boolean
            reversedns:
                description: |-
                    ReverseDNS allows stats that haven't been previously decorated with any source/destination name
                    to override the name with the network hostname of the source and destination IPs.
                    This is an experimental feature and it is not guaranteed to work on most virtualized environments
                    for external traffic.
                type: object
                properties:
                    cachelen:
                        description: |-
                            CacheLen only applies to the "local" and "ebpf" ReverseDNS type. It
                            specifies the max size of the LRU cache that is checked before
                            performing the name lookup. Default: 256
                            It also accepts OTEL_EBPF_NETWORK_REVERSE_DNS_CACHE_LEN for backwards-compatibility
                        type: integer
                    cachettl:
                        description: |-
                            CacheTTL only applies to the "local" and "ebpf" ReverseDNS type. It
                            specifies the time-to-live of a cached IP->hostname entry. After the
                            cached entry becomes older than this time, the IP->hostname entry will be looked
                            up again.
                            It also accepts OTEL_EBPF_NETWORK_REVERSE_DNS_CACHE_TTL for backwards-compatibility
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    type:
                        description: |-
                            Type specifies the ReverseDNS method. Values are "none" (default), "local" and "ebpf"
                            It also accepts OTEL_EBPF_NETWORK_REVERSE_DNS_TYPE for backwards-compatibility
                        type: string
                additionalProperties: false
        additionalProperties: false
    targetpids:
        description: |-
            TargetPIDs selects processes by PID for instrumentation. When non-empty, only these PIDs are
            instrumented. Accepts YAML list (target_pids: [1234, 5678]), single number, or env
            OTEL_EBPF_TARGET_PID=1234,5678. Alternative to Exec or AutoTargetExe when PIDs are known.
        type: object
        properties:
            ranges:
                type: array
                items:
                    type: object
                    properties:
                        end:
                            description: if End == 0, this entry is a single value; otherwise it's an inclusive range
                            type: integer
                        start:
                            type: integer
                    additionalProperties: false
        additionalProperties: false
    traceprinter:
        type: string
    traces:
        type: object
        properties:
            backoffinitialinterval:
                description: |-
                    Configuration options for BackOffConfig of the traces exporter.
                    See https://github.com/open-telemetry/opentelemetry-collector/blob/main/config/configretry/backoff.go
                    BackOffInitialInterval the time to wait after the first failure before retrying.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            backoffmaxelapsedtime:
                description: BackOffMaxElapsedTime specifies the maximum amount of time (including retries) spent trying to send a request/batch.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            backoffmaxinterval:
                description: BackOffMaxInterval specifies the upper bound on backoff interval.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            batchmaxsize:
                description: |-
                    BatchMaxSize is the maximum number of spans that the batcher will accumulate
                    before flushing a batch to the sending queue.
                type: integer
            batchtimeout:
                description: BatchTimeout is the time after which a batch will be sent regardless of its size.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            commonendpoint:
                type: string
            injectheaders:
                description: InjectHeaders allows injecting custom headers to the HTTP OTLP exporter
                type: object
            insecureskipverify:
                description: InsecureSkipVerify enables skipping TLS certificate verification (not standard, so we don't follow the same naming convention)
                type: boolean
            instrumentations:
                description: Allows configuration of which instrumentations should be enabled, e.g. http, grpc, sql...
