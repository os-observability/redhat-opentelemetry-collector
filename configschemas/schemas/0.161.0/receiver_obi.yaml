                        items:
                            type: number
                    genaitokenusagehistogram:
                        type: array
                        items:
                            type: number
                    requestsizehistogram:
                        type: array
                        items:
                            type: number
                    responsesizehistogram:
                        type: array
                        items:
                            type: number
                    stattcprtthistogram:
                        type: array
                        items:
                            type: number
                additionalProperties: false
            deprfeatures:
                description: |-
                    Features specifies which metric features to export. Accepted values: application, network,
                    application_span, application_service_graph, ...

                    Deprecated: use top-level MetricsConfig.Features instead.
                type: integer
            disablebuildinfo:
                type: boolean
            exemplarfilter:
                description: |-
                    ExemplarFilter controls when exemplars are attached to metrics.
                    Accepted values: "always_on", "always_off", "trace_based".
                    Defaults to "always_off": do not attach exemplars.
                    This mimics the OTEL_METRICS_EXEMPLAR_FILTER specification.
                type: string
            extraresourcelabels:
                description: |-
                    ExtraResourceLabels adds extra metadata labels to Prometheus metrics from sources whose availability can't be known
                    beforehand. For example, to add the OTEL deployment.environment resource attribute as a Prometheus resource attribute,
                    you should add `deployment.environment`.
                type: array
                items:
                    type: string
            extraspanresourcelabels:
                description: |-
                    ExtraSpanResourceLabels adds extra metadata labels to Prometheus span metrics from sources whose availability can't be known
                    beforehand. For example, to add the OTEL deployment.environment resource attribute as a Prometheus resource attribute,
                    you should add `deployment.environment`.
                type: array
                items:
                    type: string
            instrumentations:
                description: Allows configuration of which instrumentations should be enabled, e.g. http, grpc, sql...
                type: array
                items:
                    type: object
            nativehistogram:
                description: |-
                    NativeHistogram configures native histogram bucket parameters.
                    Uses recommended values if not specified.
                type: object
                properties:
                    bucketfactor:
                        type: number
                    maxbucketnumber:
                        type: integer
                    minresetduration:
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                additionalProperties: false
            path:
                type: string
            port:
                description: 0 means disabled
                type: integer
            registry:
                description: |-
                    Registry is only used for embedding OBI within third-party collectors.
                    It must be nil when OBI runs as standalone
                type: object
            spanmetricsservicecachesize:
                type: integer
            ttl:
                description: |-
                    TTL specifies the time since a metric was updated for the last time until it is
                    removed from the metrics set.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
        additionalProperties: false
    routes:
        description: Routes configures URL path grouping. If not set, data will be directly forwarded to exporters.
        type: object
        properties:
            ignoredevents:
                description: 'Deprecated: To be removed and replaced by a collector-like filtering mechanism'
                type: string
            ignorepatterns:
                description: 'Deprecated: To be removed and replaced by a collector-like filtering mechanism'
                type: array
                items:
                    type: string
            maxpathsegmentcardinality:
                description: |-
                    Max allowed path segment cardinality (per service) for the heuristic matcher
                    0 = disabled
                type: integer
            patterns:
                description: Patterns defines the URL path patterns that will match to a route
                type: array
                items:
                    type: string
            unmatch:
                description: |-
                    Unmatch specifies what to do when a route pattern is not matched.
                    Empty string is treated the same as "wildcard".
                type: string
            wildcardchar:
                description: Character that will be used to replace route segments
                type: string
        additionalProperties: false
    servicename:
        description: |-
            ServiceName specifies the name of the instrumented service, taken from either OTEL_EBPF_SERVICE_NAME env var or OTEL_SERVICE_NAME (for OTEL spec compatibility).
            Using env and envDefault is a trick to get the value either from one of either variables.

            Deprecated: Service name should be set in the instrumentation target (env vars, kube metadata...)
            as this is a reminiscence of past times when we only supported one executable per instance.
        type: string
    servicenamespace:
        description: |-
            Deprecated: Service namespace should be set in the instrumentation target (env vars, kube metadata...)
            as this is a reminiscence of past times when we only supported one executable per instance.
        type: string
    shutdowntimeout:
        description: Timeout for a graceful shutdown
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    stats:
